<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Monograma no verde institucional, com o G serifado da marca. A medalha
       anterior era genérica: fita, disco e estrela é o desenho de qualquer
       prêmio. Aqui o que identifica é a própria marca do sistema, que é o que
       a pessoa vê no topo da tela.

       Sem detalhe fino de propósito: na aba isto aparece com 16px, e o brasão
       do tribunal, colorido e cheio de formas, vira borrão nesse tamanho. -->
  <rect width="32" height="32" rx="6" fill="#123128"/>
  <text x="16" y="23.5"
        text-anchor="middle"
        font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="22"
        fill="#efe9dc">G</text>
</svg>
