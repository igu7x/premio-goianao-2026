<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Troféu dourado sobre o verde da barra lateral. Formas cheias e poucas:
       na aba ele aparece com 16px, e detalhe fino vira borrão. -->
  <rect width="32" height="32" rx="7" fill="#133f35"/>
  <g fill="#c9a227">
    <!-- alças -->
    <path d="M9 8.5H5.5v2.2c0 3 2.1 5.2 5 5.6l.4-2.1c-1.8-.3-3.1-1.7-3.1-3.5v-.1H9z"/>
    <path d="M23 8.5h3.5v2.2c0 3-2.1 5.2-5 5.6l-.4-2.1c1.8-.3 3.1-1.7 3.1-3.5v-.1H23z"/>
    <!-- taça -->
    <path d="M8.5 6h15v5.5c0 4.3-3.2 7.6-7.5 7.6s-7.5-3.3-7.5-7.6z"/>
    <!-- haste e base -->
    <rect x="14.2" y="18.5" width="3.6" height="4.5"/>
    <rect x="10.5" y="22.5" width="11" height="3.5" rx="1"/>
  </g>
  <!-- brilho da taça -->
  <path d="M11.3 8.3v3c0 1.6.8 3 2 3.9" fill="none" stroke="#f0d68a" stroke-width="1.4" stroke-linecap="round"/>
</svg>
