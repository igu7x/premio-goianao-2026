# Roteamento de aplicacao de pagina unica.
#
# O React Router resolve /verificar/ABCD-1234-EFGH no navegador, mas quem abre
# esse endereco direto — e e o que acontece com o QR do certificado — faz uma
# requisicao real ao servidor, que nao tem esse arquivo. Sem o rewrite abaixo,
# ler o QR de um certificado devolve 404.
#
# A ordem importa: so cai no index.html o que nao for arquivo nem diretorio
# existente, senao os assets e o config.js tambem virariam a pagina inicial.
<Directory "/opt/app-root/src">
    RewriteEngine On
    RewriteBase /

    AddType application/javascript .js .mjs
    AddType text/css .css

    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.html [L]
</Directory>

# O bundle tem hash no nome, entao pode ser guardado por muito tempo. O
# index.html e o config.js, nao: sao os dois arquivos que mudam de conteudo
# mantendo o nome, e um cache agressivo neles serve versao velha depois do
# deploy.
<FilesMatch "\.(js|css|woff2?|png|svg|jpg)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>

<FilesMatch "^(index\.html|config\.js)$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
</FilesMatch>
