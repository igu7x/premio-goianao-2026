spring:
  application:
    name: goianao
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 32MB
  # As migracoes sao aplicadas na subida da aplicacao, nao por script enviado a
  # equipe de banco. O Liquibase toma um lock (databasechangeloglock) antes de
  # comecar, entao varias replicas subindo ao mesmo tempo nao concorrem: a
  # primeira migra e as demais esperam.
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080
  error:
    include-message: always

# Saude para as probes do OpenShift. Apenas o grupo health e exposto, e sem
# detalhes: a resposta e publica (nao passa pelo JWT) e nao deve revelar host de
# banco nem espaco em disco.
#
# A separacao entre liveness e readiness e deliberada. Liveness responde "o
# processo esta vivo?" e nao inclui o banco -- se o PostgreSQL cair, reiniciar o
# pod nao resolve nada e ainda cria laco de reinicio. Readiness inclui o banco,
# porque sem ele a aplicacao nao tem como atender: o pod sai do balanceamento e
# volta sozinho quando o banco responder.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

goianao:
  jwt:
    # Sobrescreva em producao (GOIANAO_JWT_SEGREDO). Minimo de 32 bytes para HS256.
    segredo: ${GOIANAO_JWT_SEGREDO:desenvolvimento-goianao-tjgo-chave-local-nao-use-em-producao}
    expiracao-horas: 8
  # Base publica usada para montar a URL do QR de verificacao (feature 007).
  base-verificacao: ${GOIANAO_BASE_VERIFICACAO:http://localhost:5173}

  # Primeiro superadministrador, criado na subida quando ainda nao existe
  # nenhum. A SENHA NAO FICA NO REPOSITORIO: vem de GOIANAO_SUPERADMIN_SENHA e
  # e gravada como hash BCrypt. Sem a variavel, nenhum superadmin e criado e o
  # log diz o que falta -- subir sem superadmin e melhor do que subir com uma
  # senha que qualquer leitor do codigo conheceria.
  superadmin:
    email: ${GOIANAO_SUPERADMIN_EMAIL:}
    senha: ${GOIANAO_SUPERADMIN_SENHA:}
    cpf: ${GOIANAO_SUPERADMIN_CPF:}
    nome: ${GOIANAO_SUPERADMIN_NOME:Superadministrador}

  # SSO corporativo (Keycloak do TJGO). Vazio ate o client existir: sem as
  # cinco primeiras propriedades o SSO fica desligado e vale o login mockado.
  #
  # ATENCAO na url: o Keycloak do tribunal e anterior a v17, entao o caminho
  # inclui /auth -- https://<host-do-keycloak>/auth, nao https://<host-do-keycloak>.
  # Sem o sufixo o login falha com "Resource not found".
  # Os nomes abaixo sao os que a infraestrutura do TJGO ja provisiona no
  # OpenShift. A grafia KEYCLOACK e a deles; aceito tambem KEYCLOAK como
  # alternativa, porque uma variavel com o nome trocado nao quebra a subida:
  # ela deixa o SSO vazio e a aplicacao cai no login mockado, que e uma falha
  # silenciosa e bem pior do que nao subir.
  sso:
    url: ${OPENSHIFT_SSO_KEYCLOACK_URL:${OPENSHIFT_SSO_KEYCLOAK_URL:}}
    realm: ${OPENSHIFT_SSO_KEYCLOACK_REALM:${OPENSHIFT_SSO_KEYCLOAK_REALM:}}
    client-id: ${OPENSHIFT_SSO_KEYCLOACK_CLIENT_ID:${OPENSHIFT_SSO_CLIENT_ID:}}
    client-secret: ${OPENSHIFT_SSO_KEYCLOACK_SECRET:${OPENSHIFT_SSO_SECRET:}}
    redirect-uri: ${OPENSHIFT_SSO_KEYCLOACK_REDIRECT_URI:${OPENSHIFT_SSO_KEYCLOAK_REDIRECT_URI:}}
    # Para onde devolver o navegador depois do login. E o mesmo endereco publico
    # que vai impresso no QR, entao acompanha BASE_VERIFICACAO por padrao e so
    # precisa de variavel propria se um dia forem endereços diferentes.
    url-frontend: ${GOIANAO_URL_FRONTEND:${GOIANAO_BASE_VERIFICACAO:http://localhost:5173}}
    # Tentados em ordem ate achar um CPF valido. A infra ainda nao confirmou
    # em qual claim ele vem; quando confirmar, basta definir OPENSHIFT_SSO_CLAIMS_CPF
    # com o nome certo, sem alterar codigo.
    claims-cpf: ${OPENSHIFT_SSO_CLAIMS_CPF:cpf,CPF,preferred_username}
    claim-nome: ${OPENSHIFT_SSO_CLAIMS_NAME:name}
  storage:
    # banco (padrao) ou filesystem. No OpenShift o pod nao tem disco que
    # sobreviva ao restart, e a arte precisa durar tanto quanto o certificado
    # que ela imprime.
    tipo: ${GOIANAO_STORAGE_TIPO:banco}
    dir: ${GOIANAO_STORAGE_DIR:./data/artes}
  layout:
    # A4 paisagem a 300 DPI ~ 3508x2480 px (003/RNF-4).
    largura-minima: 2400
    tolerancia-proporcao: 0.05
  # Frontend e API sao apps separados, com Routes distintas: o navegador trata
  # como origens diferentes e a chamada so passa se a origem do frontend estiver
  # listada aqui. Sem a variavel, vale o padrao de desenvolvimento e NENHUMA
  # chamada funciona em homologacao ou producao.
  cors:
    origens: ${GOIANAO_CORS_ORIGENS:http://localhost:5173,http://127.0.0.1:5173}

  # Portas de entrada alem do SSO. Ambas DESLIGADAS por padrao: esquecer a
  # variavel em producao deixa o sistema no estado seguro.
  #
  # Em producao nenhuma das duas deve ser ligada -- vale so o SSO.
  # Em homologacao, GOIANAO_LOGIN_SENHA=true (nem todos tem conta no Keycloak
  # de teste). O login mockado nao: ele dispensa credencial.
  login:
    senha: ${GOIANAO_LOGIN_SENHA:false}
    mock: ${GOIANAO_LOGIN_MOCK:false}
  verificacao-publica:
    consultas-por-minuto: 30
  dados-demo: false

logging:
  level:
    br.jus.tjgo.goianao: INFO
