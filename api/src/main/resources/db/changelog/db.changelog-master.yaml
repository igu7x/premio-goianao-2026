# Changelog do Prêmio Goianão.
#
# As migrações continuam sendo SQL puro, não changesets declarativos do
# Liquibase. É deliberado: o esquema tem restrições que dependem do banco
# (índice único sobre coluna nula para materializar "no máximo uma edição
# vigente", CHECK de status, identidade com GENERATED BY DEFAULT) e escrever
# isso em XML/YAML esconderia o que de fato roda. O mesmo SQL vale em PostgreSQL
# e em H2 no modo de compatibilidade, então serve a produção, ao
# desenvolvimento e aos testes.
#
# A lista é explícita, não includeAll: acrescentar uma migração deve ser um ato
# deliberado, e não algo que acontece porque um arquivo apareceu na pasta.
#
# Cada arquivo é imutável depois de aplicado — o Liquibase guarda o checksum e
# recusa alterações. Correção de esquema entra como arquivo novo.
databaseChangeLog:
  - include: { file: db/changelog/001-identidade-e-edicoes.sql }
  - include: { file: db/changelog/002-unidades-e-reconhecimentos.sql }
  - include: { file: db/changelog/003-layouts.sql }
  - include: { file: db/changelog/004-servidores-habilitados.sql }
  - include: { file: db/changelog/005-certificados-emitidos.sql }
  - include: { file: db/changelog/006-artes-no-banco.sql }
  - include: { file: db/changelog/007-usuarios.sql }
  - include: { file: db/changelog/008-responsavel-pela-unidade.sql }
  - include: { file: db/changelog/009-superadministrador-inicial.sql }
  - include: { file: db/changelog/010-email-como-chave.sql }
  - include: { file: db/changelog/011-codigos-do-siedos.sql }
