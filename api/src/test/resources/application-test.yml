spring:
  # Sem context declarado, o Liquibase roda todos os changesets. Declarar
  # "teste" aqui deixa de fora os que pedem outro context — hoje, a criacao do
  # superadministrador inicial (009), que acrescentaria um usuario e quebraria
  # as contagens do cadastro em UsuarioIT.
  liquibase:
    contexts: teste
  datasource:
    url: jdbc:h2:mem:goianao-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

goianao:
  dados-demo: false
  base-verificacao: https://goianao.tjgo.jus.br
  storage:
    dir: ./target/artes-teste
  # Os testes exercitam as duas portas de entrada; quem verifica que elas podem
  # ser desligadas sobrescreve estas propriedades (ver LoginPorAmbienteIT).
  login:
    senha: true
    mock: true

logging:
  level:
    org.hibernate.SQL: WARN
